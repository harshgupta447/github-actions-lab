
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }

        main {
            max-width: 600px;
            margin: 24px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #17203318;
            text-align: center;
        }

        h1 { color: #1769e0; }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #1769e0;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        #message { font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <h1>My First CI/CD Pipeline working!</h1>
        <p>Welcome to my GitHub Actions Lab application.</p>
        <p>This website is deployed automatically using GitHub Actions.</p>
        <button onclick="showMessage()">Test Website</button>
        <p id="message"></p>
    </main>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Success! Your website is working.";
        }
    </script>
</body>
</html>
